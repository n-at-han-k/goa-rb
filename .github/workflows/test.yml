# Runs the suite in the same dev shell a developer gets.
#
# This gem is pure Ruby, so there is nothing to cross-compile and no
# per-platform matrix. What it does need is Goa-1.0.typelib and the glib that
# typelib was built against -- get those from two different places and GIO is
# registered twice in one process, which fails as
# `cannot register existing type 'GTlsCertificate'`.
#
# flake.nix pins all of that and builds GI_TYPELIB_PATH, so CI runs through
# `nix develop` rather than installing packages and hoping the versions line
# up. That is deliberate: the environment is the hard part of a GI binding, and
# CI checking a different environment than the one people develop in is how an
# environment bug reaches a release.
#
# This also replaces the cross-compile matrix this repository used to carry,
# which failed on every platform at `glib-sys` because
# `pkg-config --libs --cflags glib-2.0` found nothing inside rb-sys-dock.
#
# The fix for that was not "point rb-sys-dock at this flake". rb-sys-dock is a
# set of fixed upstream container images, one per target triple, and the images
# *are* the toolchain: they are pinned to an old glibc so the resulting binary
# gem runs on distributions older than the builder, which is the entire reason
# to cross-compile in a container at all. Dropping a nix store into them does
# not give `glib-sys` what it wants either, because what it wants is a glib
# cross-compiled for each target with its `.pc` file on PKG_CONFIG_PATH -- so
# satisfying it means maintaining a cross-built glib per platform, by hand,
# forever, which is a larger job than the binding it was supposed to enable.
# That is structural for every gir-generated crate, not a quirk of this repo.
#
# So the Rust route was dropped instead, and with it the need to compile
# anything per platform. One `nix develop` job on ubuntu-latest is now the
# whole matrix, and it runs the same shell a developer gets.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The flake evaluates `self`, so the files have to be in git's index.
      # A checkout satisfies that; this is the guard for anything generated.
      - name: Check the tree is what the flake will see
        run: git status --porcelain

      - name: Run the suite
        run: nix develop --command bin/test

      - name: Check the licence notice
        run: nix develop --command bin/license

      # The gem must stay pure Ruby: no extension of its own, and no
      # resurrection of the Rust dependencies that were removed. Checked
      # against the built artefact as well as the gemspec, because what ships
      # is what matters.
      #
      # This deliberately does not try `gem install` into a fresh GEM_HOME.
      # The dev shell's ruby comes from bundlerEnv with GEM_HOME baked into the
      # read-only store, so an install there fails on permissions and proves
      # nothing either way. And it would not prove "no toolchain" regardless:
      # glib2 and gobject-introspection declare extensions, so installing this
      # gem does compile C and does need glib's development headers. What is
      # true, and what the README claims, is narrower -- this gem adds no build
      # step of its own, and the two extensions it pulls are the ones every
      # ruby-gnome application already has because gtk4 depends on them.
      - name: The packaged gem is pure Ruby
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            gem build goa-rb.gemspec
            contents=$(tar -xOf goa-*.gem data.tar.gz | tar -tzf -)
            echo "$contents"
            if echo "$contents" | grep -qE "(^|/)ext/|\.rs$|Cargo\.(toml|lock)"; then
              echo "::error::the packaged gem carries native-extension sources"; exit 1
            fi
            ruby -e "
              spec = Gem::Specification.load(\"goa-rb.gemspec\")
              abort \"gemspec declares extensions: #{spec.extensions}\" unless spec.extensions.empty?
              names = spec.runtime_dependencies.map(&:name).sort
              abort \"unexpected runtime deps: #{names}\" unless names == [\"gem_kit\", \"gobject-introspection\"]
              puts \"packaged gem is pure Ruby; runtime deps: #{names.join(\", \")}\"
            "
          '
